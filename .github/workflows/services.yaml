name: services

# Real gate for the Python owners: infra + owner APIs on the compose stack,
# then ruff + the full pytest suites per service (TASK-001-008).
on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md"]
  pull_request:
    paths-ignore: ["**/*.md"]

concurrency:
  group: services-${{ github.ref }}
  cancel-in-progress: true

env:
  COMPOSE_DIR: atlas-platform-contracts/infrastructure/base-compose

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10

      - name: Prepare compose env
        run: cp "$COMPOSE_DIR/.env.example" "$COMPOSE_DIR/.env"

      - name: Start core infra
        working-directory: ${{ env.COMPOSE_DIR }}
        run: docker compose up -d mongo mongo-init pg keycloak-db keycloak redis kafka

      - name: Await infra readiness
        working-directory: ${{ env.COMPOSE_DIR }}
        run: |
          set -e
          ok=""
          for i in $(seq 1 60); do
            ok=$(docker compose exec -T mongo mongosh --quiet --eval 'try{rs.status().ok}catch(e){0}' 2>/dev/null | tail -1)
            [ "$ok" = "1" ] && break
            sleep 3
          done
          [ "$ok" = "1" ] || { echo "mongo replica set never ready"; exit 1; }
          set -a; . ./.env; set +a
          for i in $(seq 1 60); do
            curl -sf -m 5 http://localhost:8180/realms/master/.well-known/openid-configuration >/dev/null && break
            sleep 3
          done
          curl -sf -m 5 http://localhost:8180/realms/master/.well-known/openid-configuration >/dev/null \
            || { echo "keycloak never ready"; exit 1; }

      - name: Seed realm + scope grants
        working-directory: ${{ env.COMPOSE_DIR }}
        run: |
          set -a; . ./.env; set +a
          export KC_URL=http://localhost:8180
          bash setup-realm.sh

      - name: Create app databases + apply control migrations
        working-directory: ${{ env.COMPOSE_DIR }}
        run: |
          set -e
          docker compose exec -T pg psql -U postgres -tc "SELECT 1 FROM pg_database WHERE datname='atlas'" | grep -q 1 \
            || docker compose exec -T pg createdb -U postgres atlas
          docker compose exec -T pg psql -U postgres -tc "SELECT 1 FROM pg_database WHERE datname='control'" | grep -q 1 \
            || docker compose exec -T pg createdb -U postgres control
          for f in "$GITHUB_WORKSPACE"/atlas-control/control-api/migrations/*.sql; do
            echo "applying $f"
            docker compose exec -T pg psql -U postgres -d control -v ON_ERROR_STOP=1 < "$f"
          done

      - name: Start owner APIs (m2 + m3)
        working-directory: ${{ env.COMPOSE_DIR }}
        run: docker compose --profile m2 --profile m3 up -d --build \
          catalog-api offers-api inventory-api payment-api psp-fake order-api

      - name: Await owner APIs
        run: |
          set -e
          for port in 8101 8103 8104 8105 8106 8190; do
            for i in $(seq 1 60); do
              curl -sf -m 5 "http://localhost:$port/health" >/dev/null && break
              sleep 3
            done
            curl -sf -m 5 "http://localhost:$port/health" \
              || { echo "API on :$port never healthy"; exit 1; }
            echo "API :$port healthy"
          done

      - name: Ruff + pytest per service
        run: |
          set -e
          for dir in \
            atlas-storefront/services/psp-fake \
            atlas-storefront/services/payment \
            atlas-storefront/services/order \
            atlas-storefront/services/catalog \
            atlas-storefront/services/offers \
            atlas-storefront/services/inventory \
            atlas-control/control-api; do
            echo "=== $dir ==="
            (cd "$dir" && uv sync && uv run ruff check . && uv run pytest -q)
          done

      - name: Compose logs on failure
        if: failure()
        working-directory: ${{ env.COMPOSE_DIR }}
        run: docker compose logs --tail 80 || true
