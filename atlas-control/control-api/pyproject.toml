[project]
name = "atlas-control-api"
version = "0.1.0"
description = "Atlas Control modular monolith API (M2 slice: catalog_ops)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1",
  "pyjwt[crypto]>=2.8,<3",
  "asyncpg>=0.29,<1",
  "pydantic>=2.0,<3",
  "opentelemetry-sdk>=1.28,<2",
  "opentelemetry-exporter-otlp>=1.28,<2",
  "opentelemetry-instrumentation-fastapi>=0.49,<1",
]

[dependency-groups]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_control"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
