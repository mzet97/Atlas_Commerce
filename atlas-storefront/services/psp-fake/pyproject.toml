[project]
name = "atlas-psp-fake"
version = "0.1.0"
description = "Deterministic fake PSP for M3 slices (dev/test only, never prod)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.0,<3",
]

[dependency-groups]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.8", "httpx>=0.27,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_psp_fake"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
