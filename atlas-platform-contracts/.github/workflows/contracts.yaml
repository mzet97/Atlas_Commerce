name: contracts
on: { push: {}, pull_request: {} }
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse all contract YAML and enforce event envelope fields
        run: |
          python3 - <<'EOF'
          import glob, sys, yaml
          required = {"event_id","event_type","aggregate_id","aggregate_version",
                      "occurred_at","schema_version","correlation_id"}
          files = glob.glob("contracts/**/*.yaml", recursive=True)
          assert files, "no contract files found"
          for f in files:
              with open(f) as fh:
                  yaml.safe_load(fh)
              print("parsed", f)
          env = open("contracts/asyncapi/domain-event-envelope.yaml").read()
          missing = [k for k in required if k not in env]
          assert not missing, f"envelope missing {missing}"
          print("envelope fields OK:", sorted(required))
          EOF
      - name: Fail if a real .env is tracked
        run: |
          git ls-files | grep -E '(^|/)\.env$' && { echo "real .env tracked"; exit 1; } || echo "no .env tracked"
