apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: atlas-ingress
  namespace: atlas
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 1m
spec:
  ingressClassName: nginx
  rules:
    - host: atlas.local
      http:
        paths:
          - path: /ops
            pathType: Prefix
            backend:
              service:
                name: control-api
                port: { number: 8102 }
          - path: /
            pathType: Prefix
            backend:
              service:
                name: storefront
                port: { number: 3100 }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: atlas-assistant-ingress
  namespace: atlas
spec:
  ingressClassName: nginx
  rules:
    - host: atlas.local
      http:
        paths:
          - path: /assistant
            pathType: Prefix
            backend:
              service:
                name: assistant-api
                port: { number: 8107 }
