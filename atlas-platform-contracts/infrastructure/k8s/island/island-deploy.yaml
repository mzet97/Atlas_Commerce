# Atlas checkout path — deploy no cluster k8s1 (k3s v1.36, 192.168.1.51).
# 5 owners do checkout como Deployments (ClusterIP) + NodePorts para a
# carga k6 na LAN. Infra (mongo/pg/kafka) é o compose da máquina
# 192.168.1.11 (mesma LAN, portas publicadas) via env externo.
apiVersion: v1
kind: Namespace
metadata:
  name: atlas
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-api
  namespace: atlas
spec:
  replicas: 1
  selector: { matchLabels: { app: catalog-api } }
  template:
    metadata: { labels: { app: catalog-api } }
    spec:
      containers:
        - name: catalog
          image: docker.io/library/atlas-base-catalog-api:latest
          imagePullPolicy: Never
          command: ["uvicorn", "atlas_catalog.main:app", "--host", "0.0.0.0", "--port", "8101"]
          env:
            - { name: MONGO_URL, value: "mongodb://192.168.1.11:27017/catalog?replicaSet=rs0&directConnection=true" }
            - { name: KAFKA_BOOTSTRAP, value: "192.168.1.11:29092" }
            - { name: PG_DSN, value: "postgresql://postgres:atlas-pg-dev-only@192.168.1.11:5432/atlas" }
            - { name: OTEL_SDK_DISABLED, value: "true" }
---
apiVersion: v1
kind: Service
metadata: { name: catalog-api, namespace: atlas }
spec:
  type: NodePort
  selector: { app: catalog-api }
  ports: [{ port: 8101, nodePort: 30101, targetPort: 8101 }]
---
