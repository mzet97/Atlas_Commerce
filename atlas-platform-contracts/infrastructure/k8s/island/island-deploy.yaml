            - { name: KAFKA_BOOTSTRAP, value: "192.168.1.11:29092" }
            - { name: PG_DSN, value: "postgresql://postgres:atlas-pg-dev-only@192.168.1.11:5432/atlas" }
            - { name: OTEL_SDK_DISABLED, value: "true" }
---
apiVersion: v1
kind: Service
metadata: { name: inventory-api, namespace: atlas }
spec:
  type: NodePort
  selector: { app: inventory-api }
  ports: [{ port: 8104, nodePort: 30104, targetPort: 8104 }]
---
