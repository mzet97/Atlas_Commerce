---
apiVersion: v1
kind: Pod
metadata:
  name: psp-fake
  namespace: atlas
  labels: { app: psp-fake, dev-only: "true" }
spec:
  hostNetwork: true
  tolerations:
    - { operator: Exists }
  containers:
    - name: psp
      image: docker.io/library/atlas-base-psp-fake:latest
      imagePullPolicy: Never
      command: ["uvicorn", "atlas_psp_fake.app:app", "--host", "0.0.0.0", "--port", "8190"]
      env:
        - { name: PSP_CALLBACK_URL, value: "http://10.0.2.100:8105/webhooks/psp" }
        - { name: PSP_WEBHOOK_SECRET, value: "psp-dev-secret-change-me" }
---
