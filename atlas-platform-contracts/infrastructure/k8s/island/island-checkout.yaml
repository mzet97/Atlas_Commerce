# Atlas island deploy — cpuset-free single-node variant (M8 dev mode).
#
# Runs the checkout path as hostNetwork pods on the island netns (no CNI,
# no kube-proxy): each owner binds a distinct port directly on 10.0.2.100.
# Stateful infra stays on the compose host and is reached via the slirp
# gateway 10.0.2.2 (= host loopback, where compose publishes). Kafka's
# advertised listener resolves through spec.hostAliases. Images imported
# into the island containerd (imagePullPolicy Never). This is a DEV
# topology for benchmarks/smoke, not the production shape (see k8s/).
#
# CONSTRAINT (proven 2026-11-03): the host kernel (7.2.11-ogc4.1) refuses
# delegating the memory/io controllers into the user tree (ENOTS even for
# container root), and kubelet hard-requires the memory controller in
# cgroup v2 — pods therefore CANNOT start under user mzet on this host.
# Fix once with host root (see sdd/evidence/EVD-008-002) or use an
# external cluster; the manifests below are the ready-to-apply shape.
apiVersion: v1
kind: Namespace
metadata:
  name: atlas
---
apiVersion: v1
kind: Pod
metadata:
  name: catalog-api
  namespace: atlas
  labels: { app: catalog-api }
spec:
  hostNetwork: true
  tolerations:
    - { operator: Exists }
  hostAliases:
    - { ip: "10.0.2.2", hostnames: [kafka] }
  containers:
    - name: catalog
      image: docker.io/library/atlas-base-catalog-api:latest
      imagePullPolicy: Never
      command: ["uvicorn", "atlas_catalog.main:app", "--host", "0.0.0.0", "--port", "8101"]
      env:
        - { name: MONGO_URL, value: "mongodb://10.0.2.2:27017/catalog?replicaSet=rs0&directConnection=true" }
        - { name: KAFKA_BOOTSTRAP, value: "kafka:29092" }
        - { name: PG_DSN, value: "postgresql://postgres:atlas-pg-dev-only@10.0.2.2:5432/atlas" }
        - { name: OTEL_SDK_DISABLED, value: "true" }
---
