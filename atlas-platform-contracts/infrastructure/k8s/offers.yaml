# offers slice: same shape as catalog (M2).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: offers-api
  namespace: atlas
spec:
  replicas: 1
  selector:
    matchLabels: { app: offers-api }
  template:
    metadata:
      labels: { app: offers-api }
    spec:
      containers:
        - name: api
          image: atlas-offers:dev
          command: ["uvicorn", "atlas_offers.main:app", "--host", "0.0.0.0", "--port", "8000"]
          ports: [{ containerPort: 8000 }]
          env:
            - { name: MONGO_URL, value: "mongodb://mongo:27017/offers?replicaSet=rs0" }
            - name: PG_DSN
              valueFrom: { secretKeyRef: { name: atlas-secrets, key: pg-dsn } }
            - { name: OTEL_SERVICE_NAME, value: atlas-offers }
          envFrom: [{ configMapRef: { name: atlas-config } }]
          livenessProbe: { httpGet: { path: /health, port: 8000 }, initialDelaySeconds: 20, periodSeconds: 15 }
          readinessProbe: { httpGet: { path: /health, port: 8000 }, initialDelaySeconds: 10, periodSeconds: 10 }
          resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { cpu: 500m, memory: 512Mi } }
---
apiVersion: v1
kind: Service
metadata:
  name: offers-api
  namespace: atlas
spec:
  selector: { app: offers-api }
  ports: [{ port: 8000, targetPort: 8000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: offers-relay
  namespace: atlas
spec:
  replicas: 1
  selector:
    matchLabels: { app: offers-relay }
  template:
    metadata:
      labels: { app: offers-relay }
    spec:
      containers:
        - name: relay
          image: atlas-offers:dev
          command: ["python", "-m", "atlas_offers.relay"]
          env:
            - { name: MONGO_URL, value: "mongodb://mongo:27017/offers?replicaSet=rs0" }
            - { name: OTEL_SERVICE_NAME, value: atlas-offers-relay }
          envFrom: [{ configMapRef: { name: atlas-config } }]
          resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { cpu: 200m, memory: 256Mi } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: offers-projector
  namespace: atlas
spec:
  replicas: 1
  selector:
    matchLabels: { app: offers-projector }
  template:
    metadata:
      labels: { app: offers-projector }
    spec:
      containers:
        - name: projector
          image: atlas-offers:dev
          command: ["python", "-m", "atlas_offers.projector"]
          env:
            - name: PG_DSN
              valueFrom: { secretKeyRef: { name: atlas-secrets, key: pg-dsn } }
            - { name: OTEL_SERVICE_NAME, value: atlas-offers-projector }
          envFrom: [{ configMapRef: { name: atlas-config } }]
          resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { cpu: 200m, memory: 256Mi } }
